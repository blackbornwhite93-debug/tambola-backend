<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tambola Live Room</title><script src="/socket.io/socket.io.js"></script><style>body{text-align:center;font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f4f4f9;color:#333}.container{max-width:500px;margin:0 auto}.number-box{font-size:64px;color:#e63946;font-weight:bold;margin:20px 0;background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.05)}.btn{padding:15px 30px;font-size:16px;font-weight:bold;background:#2a9d8f;color:#fff;border:none;border-radius:10px;cursor:pointer;margin-bottom:20px;width:100%;box-shadow:0 4px 6px rgba(0,0,0,0.1)}.ticket-table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.08)}.ticket-table td{width:11.11%;height:50px;border:1px solid #ddd;text-align:center;font-size:20px;font-weight:bold;cursor:pointer;user-select:none}.ticket-table td.marked{background:#e63946;color:#fff;text-decoration:line-through}.ticket-table td.empty{background:#f0f0f5;cursor:default}.history-box{background:#fff;padding:15px;border-radius:10px;margin-top:20px;font-size:16px;line-height:1.6;word-wrap:break-word;box-shadow:0 4px 10px rgba(0,0,0,0.05)}</style></head><body><div class="container"><h2>🎉 Tambola Live Room</h2><div class="number-box" id="num">-</div><button id="startBtn" class="btn" style="background:#1d3557">Host: Start Game Loop</button><h3>🎟️ Your 3x9 Game Ticket</h3><button id="generateTicketBtn" class="btn">Generate New Ticket Matrix</button><table class="ticket-table" id="ticketGrid"></table><h3>📋 Numbers Called History</h3><div class="history-box" id="history">No numbers drawn yet.</div></div>
<script>const socket=io(),numDisplay=document.getElementById("num"),historyDisplay=document.getElementById("history"),startBtn=document.getElementById("startBtn"),ticketGrid=document.getElementById("ticketGrid"),generateTicketBtn=document.getElementById("generateTicketBtn");let markedCount=0,hasWonEarlyFive=!1;startBtn.addEventListener("click",(()=>socket.emit("start-game"))),socket.on("number-drawn",(e=>{numDisplay.innerText=e.current,historyDisplay.innerText=e.history.join(", "),function(e){if("speechSynthesis"in window){window.speechSynthesis.cancel();let t=e<10?"Single number "+e:"Number "+e,n=new SpeechSynthesisUtterance(t);n.rate=.9,window.speechSynthesis.speak(n)}}(e.current),function(e){const t=ticketGrid.getElementsByTagName("td");for(let n of t)n.innerText==e&&(n.style.border="3px solid #e63946")}(e.current)})),socket.on("sync-state",(e=>{e.history.length>0&&(historyDisplay.innerText=e.history.join(", "))})),generateTicketBtn.addEventListener("click",(()=>{ticketGrid.innerHTML="",markedCount=0,hasWonEarlyFive=!1;let e=Array.from({length:3},(()=>Array(9).fill("")));for(let t=0;t<3;t++){let n=[];while(n.length<5){let o=Math.floor(9*Math.random());if(!n.includes(o)){n.push(o);let c=0===o?1:10*o,r=8===o?90:10*o+9;e[t][o]=Math.floor(Math.random()*(r-c+1))+c}}}for(let t=0;t<3;t++){let n=document.createElement("tr");for(let o=0;o<9;o++){let c=document.createElement("td");""===e[t][o]?c.classList.add("empty"):(c.innerText=e[t][o],c.addEventListener("click",(()=>{c.classList.contains("marked")?(c.classList.remove("marked"),markedCount--):(c.classList.add("marked"),markedCount++,5===markedCount&&!hasWonEarlyFive&&(hasWonEarlyFive=!0,alert("🏆 CONGRATULATIONS! You won EARLY FIVE!! 🎟️")))}))),n.appendChild(c)}ticketGrid.appendChild(n)}});</script></body></html>
