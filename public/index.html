<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambola Mobile Client</title>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body style="text-align: center; font-family: sans-serif; margin-top: 50px; background: #f4f4f9;">
    <h1>Current Number: <span id="num" style="color: red; font-size: 48px;">-</span></h1>
    <button id="startBtn" style="padding: 12px 24px; font-size: 16px; background: green; color: white; border: none; border-radius: 5px;">Host: Start Game Loop</button>
    <h3>Called Numbers:</h3>
    <p id="history" style="font-size: 18px; word-wrap: break-word; padding: 0 20px;"></p>

    <script>
        const socket = io();
        const numDisplay = document.getElementById('num');
        const historyDisplay = document.getElementById('history');
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', () => socket.emit('start-game'));

        socket.on('number-drawn', (data) => {
            numDisplay.innerText = data.current;
            historyDisplay.innerText = data.history.join(', ');
        });

        socket.on('sync-state', (data) => {
            if(data.history.length > 0) {
                historyDisplay.innerText = data.history.join(', ');
            }
        });
    </script>
</body>
</html>
