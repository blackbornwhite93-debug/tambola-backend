<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tambola Premium Live</title><script src="/socket.io/socket.io.js"></script><style>body{text-align:center;font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f4f4f9;color:#333}.container{max-width:500px;margin:0 auto}.number-box{font-size:64px;color:#e63946;font-weight:bold;margin:20px 0;background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,0.05)}.btn{padding:15px 30px;font-size:16px;font-weight:bold;background:#2a9d8f;color:#fff;border:none;border-radius:10px;cursor:pointer;margin-bottom:10px;width:100%}.select-timer{padding:12px;font-size:16px;width:100%;margin-bottom:20px;border-radius:10px;border:1px solid #ccc;background:#fff;font-weight:bold}.ticket-table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.08)}.ticket-table td{width:11.11%;height:50px;border:1px solid #ddd;text-align:center;font-size:20px;font-weight:bold;cursor:pointer;user-select:none}.ticket-table td.marked{background:#e63946;color:#fff;text-decoration:line-through}.ticket-table td.empty{background:#f0f0f5;cursor:default}.history-box{background:#fff;padding:15px;border-radius:10px;margin-top:20px;font-size:16px;line-height:1.6;word-wrap:break-word;box-shadow:0 4px 10px rgba(0,0,0,0.05)}</style></head><body><div class="container"><h2>🎉 Tambola Live Room</h2><div class="number-box" id="num">-</div><select id="timerSelect" class="select-timer"><option value="3000">Speed: Fast (3 seconds)</option><option value="5000" selected>Speed: Normal (5 seconds)</option><option value="8000">Speed: Relaxed (8 seconds)</option><option value="12000">Speed: Slow (12 seconds)</option></select><button id="startBtn" class="btn" style="background:#1d3557">Host: Start Game Loop</button><h3>🎟️ Your 3x9 Game Ticket</h3><button id="generateTicketBtn" class="btn">Generate New Ticket Matrix</button><table class="ticket-table" id="ticketGrid"></table><h3>📋 Numbers Called History</h3><div class="history-box" id="history">No numbers drawn yet.</div></div>
<script>const socket=io();const numDisplay=document.getElementById("num");const historyDisplay=document.getElementById("history");const startBtn=document.getElementById("startBtn");const ticketGrid=document.getElementById("ticketGrid");const generateTicketBtn=document.getElementById("generateTicketBtn");const timerSelect=document.getElementById("timerSelect");let markedCount=0;let claims={earlyFive:false,topLine:false,middleLine:false,bottomLine:false,fullHouse:false};startBtn.addEventListener("click",()=>{const speed=parseInt(timerSelect.value);socket.emit("start-game",{speed:speed})});socket.on("number-drawn",(data)=>{numDisplay.innerText=data.current;historyDisplay.innerText=data.history.join(", ");if("speechSynthesis"in window){window.speechSynthesis.cancel();let t=data.current<10?"Single number "+data.current:"Number "+data.current;let u=new SpeechSynthesisUtterance(t);u.rate=0.9;window.speechSynthesis.speak(u)}highlightTicketNumber(data.current)});socket.on("sync-state",(data)=>{if(data.history.length>0){historyDisplay.innerText=data.history.join(", ")}});
generateTicketBtn.addEventListener("click",()=>{ticketGrid.innerHTML="";markedCount=0;claims={earlyFive:false,topLine:false,middleLine:false,bottomLine:false,fullHouse:false};let matrix=Array.from({length:3},()=>Array(9).fill(""));for(let r=0;r<3;r++){let pl=[];while(pl.length<5){let col=Math.floor(Math.random()*9);if(!pl.includes(col)){pl.push(col);let min=col===0?1:col*10;let max=col===8?90:(col*10)+9;matrix[r][col]=Math.floor(Math.random()*(max-min+1))+min}}}for(let r=0;r<3;r++){let rowTr=document.createElement("tr");rowTr.setAttribute("data-row",r);for(let c=0;c<9;c++){let td=document.createElement("td");if(matrix[r][c]===""){td.classList.add("empty")}else{td.innerText=matrix[r][c];td.addEventListener("click",()=>{if(!td.classList.contains("marked")){td.classList.add("marked");markedCount++;checkWinPatterns()}else{td.classList.remove("marked");markedCount--}})}rowTr.appendChild(td)}ticketGrid.appendChild(rowTr)}});function checkWinPatterns(){if(markedCount===5&&!claims.earlyFive){claims.earlyFive=true;alert("🏆 EARLY FIVE CLAIMED!")}checkLine(0,"topLine","⭐ TOP LINE CLAIMED!");checkLine(1,"middleLine","⭐ MIDDLE LINE CLAIMED!");checkLine(2,"bottomLine","⭐ BOTTOM LINE CLAIMED!");if(markedCount===15&&!claims.fullHouse){claims.fullHouse=true;alert("👑 CONGRATULATIONS! FULL HOUSE CHAMPION!!! 🎉")}}function checkLine(rowIdx,claimKey,msg){if(claims[claimKey])return;const row=ticketGrid.querySelector(`tr[data-row="${rowIdx}"]`);const cells=row.getElementsByTagName("td");let totalNumbers=0;let markedNumbers=0;for(let cell of cells){if(!cell.classList.contains("empty")){totalNumbers++;if(cell.classList.contains("marked"))markedNumbers++}}if(totalNumbers>0&&markedNumbers===totalNumbers){claims[claimKey]=true;alert(msg)}}function highlightTicketNumber(n){const cells=ticketGrid.getElementsByTagName("td");for(let cell of cells){if(cell.innerText==n){cell.style.border="3px solid #e63946"}}}</script></body></html>
